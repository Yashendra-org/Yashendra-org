<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%">
  <defs>
    <!-- Glowing colors matching Tokyonight/Blue/Purple theme -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#667eea" />
      <stop offset="50%" style="stop-color:#764ba2" />
      <stop offset="100%" style="stop-color:#f093fb" />
    </linearGradient>

    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      /* Node Pulse Animation */
      @keyframes pulseNode {
        0%, 100% {
          transform: scale(1);
          opacity: 0.5;
          filter: drop-shadow(0 0 2px #667eea);
        }
        50% {
          transform: scale(1.4);
          opacity: 1;
          filter: drop-shadow(0 0 8px #f093fb);
        }
      }

      /* Line Signal Animation (Traveling pulse) */
      @keyframes signalFlow {
        0% {
          stroke-dashoffset: 100;
        }
        100% {
          stroke-dashoffset: -100;
        }
      }

      /* Connection Waves */
      @keyframes connectionWave {
        0%, 100% { opacity: 0.1; }
        50% { opacity: 0.4; }
      }

      .node {
        transform-origin: center;
        animation: pulseNode 3s infinite ease-in-out;
      }
      .node-delay-1 { animation-delay: 0.7s; }
      .node-delay-2 { animation-delay: 1.4s; }
      .node-delay-3 { animation-delay: 2.1s; }

      .connection-line {
        stroke: url(#lineGrad);
        stroke-width: 1;
        opacity: 0.25;
      }

      .active-pulse {
        stroke: #f093fb;
        stroke-width: 1.5;
        stroke-dasharray: 12 40;
        animation: signalFlow 4s linear infinite;
      }
      .pulse-reverse {
        animation-direction: reverse;
      }

      .bg-wave {
        fill: none;
        stroke: #764ba2;
        stroke-width: 0.5;
        opacity: 0.15;
        animation: connectionWave 5s infinite ease-in-out;
      }
    </style>
  </defs>

  <!-- Dark Background matching Readme theme -->
  <rect width="100%" height="100%" fill="#0d1117" />

  <!-- Background Cybernetic Concentric Circles -->
  <circle cx="400" cy="100" r="140" class="bg-wave" />
  <circle cx="400" cy="100" r="90" class="bg-wave" />
  <circle cx="400" cy="100" r="50" class="bg-wave" />

  <!-- Network Connections (Lines) -->
  <g>
    <!-- Row 1 Connections -->
    <line x1="80" y1="100" x2="200" y2="50" class="connection-line" />
    <line x1="80" y1="100" x2="200" y2="150" class="connection-line" />
    
    <!-- Row 2 Connections -->
    <line x1="200" y1="50" x2="350" y2="40" class="connection-line" />
    <line x1="200" y1="50" x2="320" y2="100" class="connection-line" />
    <line x1="200" y1="150" x2="320" y2="100" class="connection-line" />
    <line x1="200" y1="150" x2="350" y2="160" class="connection-line" />

    <!-- Center/Core Connections -->
    <line x1="320" y1="100" x2="480" y2="100" class="connection-line" stroke-width="1.5" />
    <line x1="350" y1="40" x2="450" y2="40" class="connection-line" />
    <line x1="350" y1="160" x2="450" y2="160" class="connection-line" />

    <!-- Row 3 Connections -->
    <line x1="480" y1="100" x2="600" y2="50" class="connection-line" />
    <line x1="480" y1="100" x2="600" y2="150" class="connection-line" />
    <line x1="450" y1="40" x2="600" y2="50" class="connection-line" />
    <line x1="450" y1="160" x2="600" y2="150" class="connection-line" />

    <!-- Row 4 Connections -->
    <line x1="600" y1="50" x2="720" y2="100" class="connection-line" />
    <line x1="600" y1="150" x2="720" y2="100" class="connection-line" />

    <!-- Intersecting diagonal connections -->
    <line x1="200" y1="50" x2="350" y2="160" class="connection-line" opacity="0.15" />
    <line x1="450" y1="40" x2="600" y2="150" class="connection-line" opacity="0.15" />
  </g>

  <!-- Active Signal Pulses (Dash Array animations flowing through paths) -->
  <g>
    <!-- Left to Center Pulses -->
    <path d="M80,100 L200,50 L320,100 L480,100" fill="none" class="active-pulse" />
    <path d="M80,100 L200,150 L350,160 L450,160 L600,150 L720,100" fill="none" class="active-pulse pulse-reverse" />
    
    <!-- Center to Right Pulses -->
    <path d="M350,40 L450,40 L600,50 L720,100" fill="none" class="active-pulse" />
    <path d="M320,100 L480,100 L600,150 L720,100" fill="none" class="active-pulse pulse-reverse" />
  </g>

  <!-- Network Nodes (Circles with Pulse Animation) -->
  <!-- Left Entry Node -->
  <circle cx="80" cy="100" r="5" fill="#667eea" class="node" />

  <!-- Layer 1 Nodes -->
  <circle cx="200" cy="50" r="6" fill="#764ba2" class="node node-delay-1" />
  <circle cx="200" cy="150" r="6" fill="#764ba2" class="node node-delay-2" />

  <!-- Layer 2 Nodes (Core cluster) -->
  <circle cx="350" cy="40" r="7" fill="#667eea" class="node node-delay-3" />
  <circle cx="320" cy="100" r="8" fill="#f093fb" class="node" filter="url(#glowEffect)" />
  <circle cx="350" cy="160" r="7" fill="#667eea" class="node node-delay-1" />

  <!-- Layer 3 Nodes (Core cluster) -->
  <circle cx="450" cy="40" r="7" fill="#667eea" class="node node-delay-2" />
  <circle cx="480" cy="100" r="8" fill="#f093fb" class="node node-delay-3" filter="url(#glowEffect)" />
  <circle cx="450" cy="160" r="7" fill="#667eea" class="node" />

  <!-- Layer 4 Nodes -->
  <circle cx="600" cy="50" r="6" fill="#764ba2" class="node node-delay-1" />
  <circle cx="600" cy="150" r="6" fill="#764ba2" class="node node-delay-2" />

  <!-- Right Exit Node -->
  <circle cx="720" cy="100" r="5" fill="#667eea" class="node node-delay-3" />

  <!-- Decorative Synapse Text / Label in background -->
  <text x="400" y="105" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#f093fb" letter-spacing="8" opacity="0.3">
    NEURAL DATA STREAM
  </text>
</svg>
