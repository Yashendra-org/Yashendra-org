<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Dark Sci-fi / Tech Color Theme Gradients -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117" />
      <stop offset="100%" style="stop-color:#161b22" />
    </linearGradient>
    <linearGradient id="glowingGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#667eea" />
      <stop offset="50%" style="stop-color:#764ba2" />
      <stop offset="100%" style="stop-color:#f093fb" />
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2d3139" />
      <stop offset="100%" style="stop-color:#1f232b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      /* Smooth Opening Animation */
      @keyframes openLid {
        0% {
          transform: perspective(1000px) rotateX(-90deg);
          opacity: 0;
        }
        20% {
          opacity: 1;
        }
        100% {
          transform: perspective(1000px) rotateX(0deg);
        }
      }

      /* Screen Content Reveal */
      @keyframes revealScreen {
        0%, 50% { opacity: 0; }
        100% { opacity: 1; }
      }

      /* Cursor Blink Animation */
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }

      /* Code Line typing/pop-in effect */
      @keyframes typeLine {
        0% { width: 0; }
        100% { width: 100%; }
      }

      /* Floating laptop reflection */
      @keyframes floatLaptop {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }

      .laptop-container {
        transform-origin: center bottom;
        animation: floatLaptop 6s ease-in-out indefinite;
      }

      .lid-group {
        transform-origin: 400px 320px;
        animation: openLid 2.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      .screen-content {
        animation: revealScreen 3s ease-out forwards;
      }

      .cursor {
        animation: blink 1s step-end infinite;
      }
    </style>
  </defs>

  <!-- Deep Blue/Black Space Background -->
  <rect width="100%" height="100%" fill="#0d1117" />
  
  <!-- Subtle Grid Pattern in background -->
  <g opacity="0.15">
    <path d="M0,50 L800,50 M0,100 L800,100 M0,150 L800,150 M0,200 L800,200 M0,250 L800,250 M0,300 L800,300 M0,350 L800,350 M0,400 L800,400" stroke="#667eea" stroke-width="0.5" />
    <path d="M100,0 L100,450 M200,0 L200,450 M300,0 L300,450 M400,0 L400,450 M500,0 L500,450 M600,0 L600,450 M700,0 L700,450" stroke="#667eea" stroke-width="0.5" />
  </g>

  <!-- Glowing Aura behind Laptop -->
  <circle cx="400" cy="220" r="180" fill="url(#glowingGrad)" opacity="0.15" filter="url(#glow)" />

  <g class="laptop-container">
    <!-- ═══════════════════════════════════════════════════════════════════════ -->
    <!-- LAPTOP LID (Opening Group)                                              -->
    <!-- ═══════════════════════════════════════════════════════════════════════ -->
    <g class="lid-group">
      <!-- Outer Bezel shadow -->
      <rect x="150" y="50" width="500" height="270" rx="16" fill="#16181d" stroke="#2d3139" stroke-width="3" />
      
      <!-- Screen Display Area -->
      <rect x="162" y="62" width="476" height="246" rx="8" fill="url(#screenGrad)" />
      
      <!-- Screen Frame Accent border (Glow effect) -->
      <rect x="161" y="61" width="478" height="248" rx="9" fill="none" stroke="url(#glowingGrad)" stroke-width="1.5" opacity="0.8" />
      
      <!-- Camera Dot -->
      <circle cx="400" cy="56" r="3" fill="#050505" />
      <circle cx="400" cy="56" r="1" fill="#0d6efd" opacity="0.7" />

      <!-- Screen Contents (Reveal Group) -->
      <g class="screen-content">
        <!-- Tech Logo Icon -->
        <g transform="translate(180, 85)">
          <rect width="32" height="32" rx="6" fill="#667eea" opacity="0.2" />
          <path d="M8,16 L16,8 L24,16 L16,24 Z" fill="none" stroke="#667eea" stroke-width="2" />
          <circle cx="16" cy="16" r="3" fill="#f093fb" />
        </g>
        
        <!-- Header Text -->
        <text x="225" y="100" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#ffffff" letter-spacing="1">
          YASHENDRA KUMAR
        </text>
        <text x="225" y="116" font-family="'Segoe UI', sans-serif" font-size="10" fill="#764ba2" font-weight="600" letter-spacing="2">
          AI &amp; DATA SCIENCE ENGINE
        </text>

        <!-- Mock Terminal Window inside Screen -->
        <rect x="180" y="135" width="440" height="155" rx="6" fill="#05070a" opacity="0.9" stroke="#1f2937" stroke-width="1" />
        
        <!-- Terminal Header Dots -->
        <circle cx="195" cy="147" r="4" fill="#ef4444" />
        <circle cx="207" cy="147" r="4" fill="#fbbf24" />
        <circle cx="219" cy="147" r="4" fill="#22c55e" />
        
        <!-- Terminal Content -->
        <g font-family="'SF Mono', Monaco, Consolas, monospace" font-size="10" fill="#a7b5eb" xml:space="preserve">
          <text x="195" y="172" fill="#22c55e">yashendra@portfolio ~ $</text>
          <text x="350" y="172" fill="#ffffff">npm run build</text>
          
          <text x="195" y="192" fill="#e5e7eb">> Loading modules...</text>
          <text x="195" y="207" fill="#6b7280">  [1] Neural Network components initialized</text>
          <text x="195" y="222" fill="#6b7280">  [2] Django Backend server listening...</text>
          <text x="195" y="237" fill="#6b7280">  [3] React Dashboard interface mounted</text>
          
          <text x="195" y="257" fill="#22c55e">yashendra@portfolio ~ $</text>
          <text x="350" y="257" fill="#f093fb">launch_portfolio --live</text>
          
          <!-- Blinking Cursor -->
          <rect x="500" y="247" width="6" height="11" fill="#667eea" class="cursor" />
        </g>
      </g>
    </g>

    <!-- ═══════════════════════════════════════════════════════════════════════ -->
    <!-- LAPTOP BASE                                                             -->
    <!-- ═══════════════════════════════════════════════════════════════════════ -->
    <!-- Laptop Hinge -->
    <rect x="250" y="316" width="300" height="10" fill="#1b1d22" rx="4" />
    
    <!-- Base Body Outer -->
    <path d="M 120,320 L 680,320 C 695,320 705,328 700,340 L 670,350 C 665,352 135,352 130,350 L 100,340 C 95,328 105,320 120,320 Z" fill="url(#bodyGrad)" stroke="#111317" stroke-width="1.5" />
    
    <!-- Base Top Plate Accent (Highlight line) -->
    <path d="M 130,322 L 670,322" stroke="#4b5563" stroke-width="1" opacity="0.5" />

    <!-- Keyboard Mock Silhouette -->
    <polygon points="170,326 630,326 620,338 180,338" fill="#14161a" opacity="0.8" />
    
    <!-- Trackpad Silhouette -->
    <polygon points="360,340 440,340 436,348 364,348" fill="#1b1d22" stroke="#2a2e37" stroke-width="0.5" />

    <!-- Front Lip Lip shadow -->
    <path d="M 130,350 C 135,352 665,352 670,350 L 672,352 C 667,354 133,354 128,352 Z" fill="#0d0e12" />
  </g>
</svg>
